				<h1>embate · Debate flow for judges</h1>
				<p>
					embate is a free flowing tool for debate judges. Each speech gets a column; write arguments as you hear them, nest sub-points, and draw arrows from every response to the argument it answers.
					A countdown or stopwatch times speeches, prep clocks track each side, and notes hold your decision.
				</p>
				<p>It supports Public Forum, Lincoln–Douglas, Policy, British Parliamentary, World Schools, Asian Parliamentary and Oregon-Oxford rounds, and saves everything in your browser.</p>
				<p>
					embate needs JavaScript to run. The source is on
					<a href="https://github.com/elvisdragonmao/embate">GitHub</a>
					.
				</p>
